# Günlük nöbetçi eczane çekimi (ADR-006, kaynak ADR-007).
#
# Çekim Cloudflare'in DIŞINDA koşar. Gerekçe: ücretsiz Workers planında
# invocation başına 10 ms CPU ve 50 dış subrequest var; 81 ilin HTML'ini
# ayrıştırmak bu sınıra sığmaz. Worker yalnızca yazma ucunu (/api/admin/import)
# ve koşu defterini (/api/admin/scrape/runs) sunar.
#
# Üç tetikleme yolu:
#   schedule           → her gün 08:15 ve 14:00 TRT
#   workflow_dispatch  → Actions sekmesinden elle
#   repository_dispatch→ panelin çekim tetikleme düğmesi
#
# Gerekli repo secret'ları:  API_URL, ADMIN_USERNAME, ADMIN_PASSWORD

# GÜNCELLEME: Çekim artık yerel sunucudaki (Coolify) zamanlanmış görevle koşuyor.
# GitHub runner'ları kaynak tarafından 403 engeli aldığı için otomatik schedule
# ve repository_dispatch devre dışı bırakıldı. Yalnızca elle tetikleme (workflow_dispatch) açık.

name: scrape

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '"tum" ya da plaka kodu'
        required: false
        default: "tum"
      days:
        description: "yalnızca bugun — kaynak başka gün sunmuyor"
        required: false
        default: "bugun"

# Aynı anda iki çekim koşmasın — kaynağa çift yük binmesin, içe aktarma
# birbirini ezmesin.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 81 il × 1 istek × 800 ms ≈ 2 dk (ölçüldü). Takılırsa kaynağı meşgul
    # etmesin diye tavan koyulur.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 ZORUNLU, keyfi değil. `scripts/scrape-edevlet.mjs` slug üretimini
          # `src/shared/slug.ts`'ten import ediyor (iki yerde ayrı yazılmasın diye)
          # ve bunu Node'un yerleşik tip sıyırmasıyla çalıştırıyor. Node 20'de o
          # yetenek YOK: import anında ERR_UNKNOWN_FILE_EXTENSION ile düşer, çekim
          # kaynağa tek istek bile atmadan biter. Bir kez oldu — 8 Ağustos 2026'da
          # koşu 19 saniyede "yeşil" bitti ve Antalya dışında hiç veri gelmedi.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Çekimi çalıştır
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY || 'fa9fdd79addee111a7a7da600e573066' }}
          # Secret shell gövdesine gömülmez, ortamdan okunur: boş kaldığında
          # sessizce bozuk bir argümana dönüşmesin.
          API_URL: ${{ secrets.API_URL }}
          # Panel düğmesinden gelen istekte kapsam client_payload'da taşınır;
          # zamanlanmış koşuda ikisi de varsayılana düşer.
          SCOPE: ${{ github.event.client_payload.scope || inputs.scope || 'tum' }}
          # Panel düğmesi hâlâ "ikisi" gönderebiliyor (Worker'daki varsayılan).
          # Çekim komutu bunu bugüne indirger ve indirgediğini yazar.
          DAYS: ${{ github.event.client_payload.days || inputs.days || 'bugun' }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_USERNAME" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::API_URL / ADMIN_USERNAME / ADMIN_PASSWORD repo secret'larından biri boş."
            exit 1
          fi

          set +e
          npm run scrape -- "$SCOPE" "$DAYS" --api "$API_URL"
          code=$?
          set -e

          # Çıkış kodu 2 = kısmi başarı (bazı il-gün ya da satır atlandı). Veri
          # yazıldı, koşu kaydı da yazıldı; iş akışını kırmızıya boyamaya değmez.
          # DİĞER her kod gerçek arızadır ve GÖRÜNÜR OLMALI: bir kez sessiz yeşil
          # bir koşu yüzünden Antalya dışında hiç veri gelmediği fark edilmedi.
          case "$code" in
            0) ;;
            2) echo "::warning::Çekim kısmi tamamlandı. Panel → Çekim sekmesinden koşu kayıtlarına bak." ;;
            *) echo "::error::Çekim çıkış kodu $code ile düştü — veri yazılmamış olabilir."; exit "$code" ;;
          esac
